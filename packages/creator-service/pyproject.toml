[project]
name = "creator-service"
version = "0.1.0"
description = "Service layer for AI Video Studio"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Yeongseon Choe"}]
urls = {Homepage = "https://github.com/yeongseon/short-form-studio", Repository = "https://github.com/yeongseon/short-form-studio"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "anyio>=4.0",
    "creator-domain>=0.1.0",
    "pydantic>=2.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "PyYAML>=6.0",
    "pillow>=13.0.0",
    "celery>=5.6.0",
    "redis>=6.0",
    "billiard>=4.2.0",
    "typing-extensions>=4.0",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30.0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.42.0", "botocore>=1.42.0"]
azure = ["azure-storage-blob>=12.0", "azure-core>=1.0"]

[tool.uv.sources]
creator-domain = { workspace = true }

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["creator_service", "creator_service.*"]

[tool.basedpyright]
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUnknownMemberType = false
extraPaths = ["../creator-domain"]
