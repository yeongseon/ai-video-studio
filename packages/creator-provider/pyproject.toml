[project]
name = "creator-provider"
version = "0.1.0"
description = "AI model provider adapters for AI Video Studio"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Yeongseon Choe"}]
urls = {Homepage = "https://github.com/yeongseon/short-form-studio", Repository = "https://github.com/yeongseon/short-form-studio"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["creator-domain>=0.1.0", "redis", "httpx>=0.27.0", "edge-tts>=6.1.0", "cairosvg>=2.7.0", "billiard>=4.2.0"]

[tool.uv.sources]
creator-domain = { workspace = true }

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.30.0"]
google = ["google-generativeai>=0.7.0"]
stability = ["stability-sdk>=0.8.0"]
elevenlabs = ["elevenlabs>=1.0.0"]
all-external = ["openai>=1.0.0", "anthropic>=0.30.0", "google-generativeai>=0.7.0", "stability-sdk>=0.8.0", "elevenlabs>=1.0.0"]
codex = ["god-tibo-imagen"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["creator_provider", "creator_provider.*"]

[tool.setuptools.package-data]
creator_provider = ["schemas/**/*.json", "tools/**/*.json", "prompts/**/*.txt"]
