# Local server: private by default, with explicit trusted-LAN opt-in.
# Requires Docker Compose >= 2.24.4 for !override (replace, never append ports).
#
# Usage:
#   make docker-local-up
#
# Use the Make helpers to validate STUDIO_WEB_BIND before invoking Docker.
# Only studio-web may opt into LAN access; backend loopback bindings are inherited.

services:
  studio-web:
    ports: !override
      - "${STUDIO_WEB_BIND:-127.0.0.1}:${STUDIO_WEB_PORT:-5174}:8080"
