name: CI

on:
  pull_request:
    branches: [main, fix/947-allow-deleting-project-status]
  push:
    branches: [main]

jobs:
  # Pull-request-only impact classifier. Unknown paths are treated as high risk.
  # All jobs run unconditionally on main push (release candidate validation).
  impact:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.detect.outputs.docs }}
      code: ${{ steps.detect.outputs.code }}
      restore: ${{ steps.detect.outputs.restore }}
      first_short: ${{ steps.detect.outputs.first_short }}
      worker: ${{ steps.detect.outputs.worker }}
      docker: ${{ steps.detect.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify PR file impact
        id: detect
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_impact.py "$BASE_SHA" "$HEAD_SHA"

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate changed-file whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"

  docs:
    needs: impact
    if: ${{ github.event_name != 'pull_request' || needs.impact.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation contract dependencies
        run: python3 -m pip install -c constraints.txt -r apps/api/requirements.txt -r apps/api/requirements-dev.txt
      - name: Install documentation contract packages
        run: >-
          python3 -m pip install -c constraints.txt
          -e packages/creator-domain
          -e packages/creator-provider
          -e packages/creator-service
      - name: Validate documentation contracts
        env:
          PYTHONPATH: apps/api/src:packages/creator-domain:packages/creator-service:packages/creator-provider
        run: >-
          python3 -m pytest
          tests/test_architecture_diagrams.py
          tests/test_ci_docs_contract_inventory.py
          apps/api/tests/test_quickstart_docs.py
          apps/api/tests/test_quickstart_execution.py
          apps/api/tests/test_first_short_walkthrough.py
          apps/api/tests/test_cutover_doc_contract.py
          -q

  restore-drill:
    needs: impact
    if: ${{ github.event_name != 'pull_request' || needs.impact.outputs.restore == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL and FFmpeg restore tooling
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client ffmpeg
      - name: Install restore test dependency
        run: python3 -m pip install -c constraints.txt -r apps/api/requirements.txt -r apps/worker-orchestrator/requirements.txt pytest
      - name: Install restore runtime packages
        run: |
          pip install -c constraints.txt -e packages/creator-domain
          pip install -c constraints.txt -e packages/creator-provider
          pip install -c constraints.txt -e packages/creator-service
      - name: Test backup manifest boundaries
        run: python3 -m pytest tests/test_restore_verify.py tests/test_restore_verify_symlinks.py tests/test_restore_verify_target.py tests/test_restore_secret_fingerprint.py tests/test_restore_database_negative.py -v
      - name: Build immutable application release manifest
        run: |
          docker run -d --name restore-registry -p 127.0.0.1:5000:5000 registry:2
          python3 scripts/build_release_manifest.py /tmp/approved-release-manifest.json
          cat /tmp/approved-release-manifest.json
      - name: Run disposable database and media restore drill
        env:
          RESTORE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RESTORE_RELEASE_MANIFEST: /tmp/approved-release-manifest.json
        run: python3 -m pytest tests/test_restore_drill.py -v -s

  lint:
    needs: impact
    if: ${{ github.event_name != 'pull_request' || needs.impact.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: python3 -m pip install -c constraints.txt -r apps/api/requirements.txt -r apps/api/requirements-dev.txt -r apps/worker-orchestrator/requirements.txt -r apps/worker-orchestrator/requirements-dev.txt
      - name: Install packages in editable mode
        run: |
          pip install -c constraints.txt -e packages/creator-domain
          pip install -c constraints.txt -e packages/creator-provider
          pip install -c constraints.txt -e packages/creator-service
      - name: Install Node dependencies
        run: npm --prefix apps/studio-web ci
      - name: Lint Python
        run: |
          ruff check apps packages
          python3 -m compileall apps packages
      - name: Enforce package dependency boundaries
        run: python3 scripts/check_package_dependencies.py
      - name: Validate architecture diagrams and links
        run: python3 scripts/check_architecture_diagrams.py
      - name: Verify uv.lock is current
        run: |
          python3 -m pip install --disable-pip-version-check uv==0.11.7
          uv lock --check
      - name: Lint TypeScript
        run: npm --prefix apps/studio-web run lint

  test:
    needs: impact
    if: ${{ github.event_name != 'pull_request' || needs.impact.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: review
          POSTGRES_PASSWORD: review-local-only
          POSTGRES_DB: settings_test
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U review" --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      FIRST_SHORT_TEST_DATABASE_URL: postgresql://review:review-local-only@127.0.0.1:5432/settings_test
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg for media tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: python3 -m pip install -c constraints.txt -r apps/api/requirements.txt -r apps/api/requirements-dev.txt -r apps/worker-orchestrator/requirements.txt -r apps/worker-orchestrator/requirements-dev.txt
      - name: Install packages in editable mode
        run: |
          pip install -c constraints.txt -e packages/creator-domain
          pip install -c constraints.txt -e packages/creator-provider
          pip install -c constraints.txt -e packages/creator-service
      - name: Validate Alembic migrations
        run: |
          cd apps/api
          export DATABASE_URL="postgresql://user:pass@localhost:5432/db"
          python3 - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          heads = ScriptDirectory.from_config(Config("alembic.ini")).get_heads()
          if len(heads) != 1:
              raise SystemExit(f"ERROR: expected one Alembic head, found {heads!r}")
          print(f"Migration validation complete (head {heads[0]})")
          PY
      - name: Install Node dependencies
        run: npm --prefix apps/studio-web ci
      - name: Test architecture dependency checker
        run: python3 -m pytest tests/test_package_dependency_cli.py tests/test_package_dependency_parser.py tests/test_package_dependency_compliance.py tests/test_architecture_diagrams.py -q
      - name: Test PR impact classifier fail-closed policy
        run: python3 -m pytest tests/test_ci_impact.py tests/test_ci_impact_git.py tests/test_ci_required.py tests/test_ci_required_workflow.py tests/test_ci_docs_contract_inventory.py -q
      - name: Test Packages (with coverage)
        run: |
          git fetch origin main:refs/remotes/origin/main --depth=1
          python3 -m pytest packages/creator-domain/tests/ -v --cov=creator_domain --cov-report=term-missing --cov-fail-under=60
          python3 -m pytest packages/creator-provider/tests/ -v --cov=creator_provider --cov-report=term-missing --cov-fail-under=60
          python3 -m pytest packages/creator-service/tests/ -v --cov=creator_service --cov-report=term-missing --cov-fail-under=60
      - name: Test API (with coverage)
        run: cd apps/api && python3 -m pytest tests/ -v --cov=shorts_api --cov-report=term-missing --cov-fail-under=75
      - name: Test Worker (with coverage)
        run: cd apps/worker-orchestrator && python3 -m pytest tests/ -v --cov=tasks --cov-report=term-missing --cov-fail-under=60
      - name: Test Frontend (with coverage)
        run: npm --prefix apps/studio-web run test -- --coverage --coverage.thresholds.lines=75
      - name: Build Frontend
        run: npm --prefix apps/studio-web run build
      - name: Typecheck Frontend
        run: cd apps/studio-web && npx tsc --noEmit
      - name: Typecheck Python (basedpyright)
        run: |
          pip install basedpyright==1.29.2
          basedpyright apps packages

  first-short-runtime:
    needs: impact
    if: ${{ github.event_name != 'pull_request' || needs.impact.outputs.first_short == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install runtime and test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg nginx
          python3 -m pip install -c constraints.txt -r apps/api/requirements.txt -r apps/api/requirements-dev.txt -r apps/worker-orchestrator/requirements.txt -r apps/worker-orchestrator/requirements-dev.txt
          python3 -m pip install -c constraints.txt -e packages/creator-domain -e packages/creator-provider -e packages/creator-service
          python3 -m pip install -c constraints.txt playwright
          python3 -m playwright install chromium
          npm --prefix apps/studio-web ci
      - name: Start disposable loopback databases
        run: |
          docker run -d --name first-short-postgres -e POSTGRES_USER=review -e POSTGRES_PASSWORD=review-local-only -e POSTGRES_DB=first_short -p 127.0.0.1:55439:5432 postgres:16-alpine
          docker run -d --name first-short-redis -p 127.0.0.1:56389:6379 redis:7.4-alpine
          timeout 60 bash -c 'until docker exec first-short-postgres pg_isready -U review; do sleep 1; done'
      - name: Verify durable assets and real first-video workflow
        env:
          MEDIA_ASSET_TEST_DATABASE_URL: postgresql://review:review-local-only@127.0.0.1:55439/first_short
          FIRST_SHORT_TEST_DATABASE_URL: postgresql://review:review-local-only@127.0.0.1:55439/first_short
          FIRST_SHORT_TEST_REDIS_URL: redis://127.0.0.1:56389/0
        run: |
          STUDIO_BROWSER_TEST=true npm --prefix apps/studio-web run build
          git fetch origin main:refs/remotes/origin/main --depth=1
          PYTHONPATH=apps/api/src python3 -m pytest apps/api/tests/test_project_settings_rollback.py apps/api/tests/test_project_settings_migration.py packages/creator-service/tests/test_project_settings_storage.py -v --basetemp=/tmp/project-settings-runtime
          python3 -m pytest packages/creator-service/tests/test_stale_pending_reconciler_fencing.py packages/creator-service/tests/test_reconciler_cleanup_claims.py packages/creator-service/tests/test_broker_recovery_resume.py -v --basetemp=/tmp/reconciler-fencing-runtime
          PYTHONPATH=tests/integration python3 -m pytest packages/creator-service/tests/test_postgres_media_asset_storage.py packages/creator-service/tests/test_temp_byte_lease.py tests/integration/test_first_short_runtime.py tests/integration/test_studio_proxy_runtime.py tests/integration/test_authorized_media_runtime.py -v --basetemp=/tmp/first-short-runtime
          PYTHONPATH=tests/integration python3 -m pytest tests/integration/test_studio_upload_browser.py tests/integration/test_timeline_preview_browser.py -v --basetemp=/tmp/studio-browser-runtime
          PYTHONPATH=tests/integration python3 -m pytest tests/integration/test_postgres_project_deletion.py tests/integration/test_postgres_project_deletion_cascade.py tests/integration/test_postgres_project_scene_cleanup.py tests/integration/test_postgres_project_deletion_barrier.py tests/integration/test_postgres_scene_acceptance_fence.py tests/integration/test_postgres_artifact_deletion_retry_fence.py tests/integration/test_postgres_scene_upload_cleanup_intent.py tests/integration/test_postgres_project_deletion_fail_closed.py tests/integration/test_project_status_migration.py tests/integration/test_postgres_enum_check_drift.py tests/integration/test_project_deletion_prerequisites.py -v --basetemp=/tmp/project-deletion-runtime
          python3 -m pytest packages/creator-service/tests/test_spend_reservations.py packages/creator-service/tests/test_owned_quota_lifecycle.py packages/creator-service/tests/test_postgres_spend_lifecycle.py packages/creator-service/tests/test_task_claim_ownership.py -v --basetemp=/tmp/spend-lifecycle-runtime
          PYTHONPATH=apps/worker-orchestrator python3 -m pytest apps/worker-orchestrator/tests/test_terminal_validation_guards.py apps/worker-orchestrator/tests/test_terminal_validation_failure.py apps/worker-orchestrator/tests/test_visual_plan_terminal_validation.py -v --basetemp=/tmp/terminal-validation-runtime
          PYTHONPATH=apps/worker-orchestrator python3 -m pytest apps/worker-orchestrator/tests/test_late_worker_outcomes.py apps/worker-orchestrator/tests/test_worker_outcome_claims.py packages/creator-service/tests/test_revocation_dispatch_race.py -v --basetemp=/tmp/late-worker-outcomes-runtime
          python3 -m pytest packages/creator-service/tests/test_quota_stage_compensation.py packages/creator-service/tests/test_postgres_quota_compensation.py -v --basetemp=/tmp/quota-compensation-runtime
          PYTHONPATH=apps/worker-orchestrator python3 -m pytest apps/worker-orchestrator/tests/test_worker_quota_ownership.py -v --basetemp=/tmp/worker-quota-ownership-runtime
          PYTHONPATH=apps/worker-orchestrator python3 -m pytest packages/creator-service/tests/test_run_version_mutations.py packages/creator-service/tests/test_run_version_cas.py packages/creator-service/tests/test_run_version_boundaries.py apps/worker-orchestrator/tests/test_run_version_outcomes.py -v --basetemp=/tmp/run-version-runtime
          PYTHONPATH=apps/worker-orchestrator python3 -m pytest apps/worker-orchestrator/tests/test_scene_cancellation.py apps/worker-orchestrator/tests/test_scene_cancellation_boundaries.py apps/worker-orchestrator/tests/test_scene_upload_cancellation.py -v --basetemp=/tmp/scene-cancellation-runtime
          PYTHONPATH=apps/worker-orchestrator:apps/api/src python3 -m pytest apps/worker-orchestrator/tests/test_provider_failure_surfaces.py apps/worker-orchestrator/tests/test_image_provider_http_surfaces.py -k postgres -v --basetemp=/tmp/provider-boundary-runtime
      - name: Verify API image lightweight execution and concurrent health
        env:
          LIGHTWEIGHT_TEST_IMAGE: first-short-api-lightweight
          FIRST_SHORT_TEST_DATABASE_URL: postgresql://review:review-local-only@127.0.0.1:55439/first_short
          FIRST_SHORT_TEST_REDIS_URL: redis://127.0.0.1:56389/0
        run: |
          docker build --target runtime -f apps/api/Dockerfile -t first-short-api-lightweight .
          python3 -m pytest tests/integration/test_api_lightweight_image.py -v
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-short-runtime-evidence
          path: /tmp/first-short-runtime
      - name: Stop disposable databases
        if: always()
        run: docker rm -f first-short-postgres first-short-redis

  worker-topology-runtime:
    needs: impact
    if: ${{ github.event_name != 'pull_request' || needs.impact.outputs.worker == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned worker dependencies
        run: |
          python3 -m pip install -c constraints.txt -r apps/api/requirements.txt -r apps/worker-orchestrator/requirements.txt -r apps/worker-orchestrator/requirements-dev.txt
          python3 -m pip install -c constraints.txt -e packages/creator-domain -e packages/creator-provider -e packages/creator-service
          python3 -c "import celery; assert celery.__version__ == '5.6.3', celery.__version__"
      - name: Build shipped worker image and start service containers
        run: |
          mkdir -p /tmp/worker-topology-runtime
          chmod 777 /tmp/worker-topology-runtime
          docker network create worker-topology
          docker run -d --name topology-postgres --network worker-topology -p 127.0.0.1:55441:5432 \
            -e POSTGRES_DB=topology -e POSTGRES_USER=review -e POSTGRES_PASSWORD=review-local-only \
            postgres:16.6-alpine
          docker run -d --name topology-redis --network worker-topology -p 127.0.0.1:56391:6379 redis:7.4-alpine
          docker build --target runtime -f apps/worker-orchestrator/Dockerfile -t worker-topology-image .
          docker image inspect worker-topology-image --format '{{.Id}}' > /tmp/worker-topology-runtime/image-digest.txt
          docker image inspect worker-topology-image --format '{{json .Config.Entrypoint}} {{json .Config.Cmd}}' \
            > /tmp/worker-topology-runtime/resolved-command.txt
          until docker exec topology-postgres pg_isready -U review -d topology; do sleep 1; done
          until docker exec topology-redis redis-cli ping; do sleep 1; done
          (cd apps/api && DATABASE_URL=postgresql://review:review-local-only@127.0.0.1:55441/topology \
            python3 -m alembic upgrade head)
          docker run --rm worker-topology-image python -c \
            "import subprocess; subprocess.run(['ffmpeg', '-version'], check=True)" \
            > /tmp/worker-topology-runtime/ffmpeg-version.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = {
              "dockerfile": "apps/worker-orchestrator/Dockerfile",
              "image": "worker-topology-image",
              "postgres": "postgres:16.6-alpine",
              "redis": "redis:7.4-alpine",
              "celery": "5.6.3",
              "scenarios": ["authenticated-stop", "quota-release", "artifact-suppression", "hard-timeout", "active-redelivery", "stale-attempt-fencing", "ffmpeg-cleanup", "fairness"],
          }
          Path("/tmp/worker-topology-runtime/manifest.json").write_text(json.dumps(manifest, indent=2))
          PY
      - name: Verify shipped worker cancellation and timeout topology
        env:
          PYTHONPATH: apps/api/src:apps/worker-orchestrator:packages/creator-domain:packages/creator-service:packages/creator-provider
          DATABASE_URL: postgresql://review:review-local-only@127.0.0.1:55441/topology
          REDIS_URL: redis://127.0.0.1:56391/0
          WORKER_TOPOLOGY_IMAGE: worker-topology-image
          WORKER_TOPOLOGY_EVIDENCE_DIR: /tmp/worker-topology-runtime
          WORKER_TOPOLOGY_PROBE_ENABLED: "1"
        run: >-
          python3 -m pytest
          apps/worker-orchestrator/tests/test_worker_topology_contract.py
          apps/worker-orchestrator/tests/test_worker_topology_process.py
          apps/worker-orchestrator/tests/test_worker_topology_image.py
          -v --junitxml=/tmp/worker-topology-runtime/results.xml
      - name: Capture worker runtime logs
        if: always()
        run: |
          for container in topology-solo-cancel topology-scaled-redelivery topology-scaled-redelivered topology-scaled-ffmpeg topology-scaled-replacement; do
            if docker inspect "$container" >/dev/null 2>&1; then
              docker logs "$container" > "/tmp/worker-topology-runtime/${container}.worker.log" 2>&1
            fi
          done
          test -s /tmp/worker-topology-runtime/topology-solo-cancel.worker.log
          test -s /tmp/worker-topology-runtime/topology-scaled-redelivery.worker.log
          test -s /tmp/worker-topology-runtime/topology-scaled-redelivered.worker.log
          test -s /tmp/worker-topology-runtime/topology-scaled-ffmpeg.worker.log
          test -s /tmp/worker-topology-runtime/topology-scaled-replacement.worker.log
          test -s /tmp/worker-topology-runtime/cancellation-final-state.json
          test -s /tmp/worker-topology-runtime/redelivery-final-state.json
          test -s /tmp/worker-topology-runtime/timeout-final-state.json
          cp /tmp/worker-topology-runtime/topology-solo-cancel.worker.log /tmp/worker-topology-runtime/worker.log
      - name: Upload worker topology evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-topology-runtime-evidence
          path: /tmp/worker-topology-runtime

  docker:
    needs: impact
    if: ${{ github.event_name != 'pull_request' || needs.impact.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quick Start smoke check without a local env file
        run: bash scripts/quickstart_smoke.sh
      - name: Create .env from example
        run: cp .env.example .env
      - name: Validate docker-compose config
        run: docker compose config --quiet
      - name: Quick Start smoke check
        run: bash scripts/quickstart_smoke.sh
      - name: Verify celery beat service is defined
        run: |
          # Every beat_schedule entry needs a running beat process (#585).
          docker compose config --services | grep -q '^beat$' \
            || { echo 'ERROR: no beat service defined — scheduled tasks will never run'; exit 1; }
      - name: Verify API port not exposed on 0.0.0.0
        run: |
          # Ensure API, Postgres, and Redis are bound to 127.0.0.1 only.
          # `docker compose config` normalizes "127.0.0.1:8000:8000" into a
          # per-port block with separate `host_ip:` and `published:` fields, so
          # we resolve each published port's host_ip via a small Python parser
          # rather than a line-oriented grep.
          docker compose config -o /tmp/compose.resolved.yml
          python3 - <<'PY'
          import sys
          import yaml

          with open("/tmp/compose.resolved.yml") as handle:
              config = yaml.safe_load(handle)

          required = {"8000": "API", "5432": "Postgres", "6379": "Redis"}
          failures = []
          for service in (config.get("services") or {}).values():
              for port in service.get("ports") or []:
                  if isinstance(port, dict):
                      published = str(port.get("published", ""))
                      host_ip = port.get("host_ip", "")
                  else:
                      # "host_ip:published:target" or "published:target"
                      parts = str(port).split(":")
                      host_ip = parts[0] if len(parts) == 3 else ""
                      published = parts[-2] if len(parts) >= 2 else ""
                  if published in required and host_ip != "127.0.0.1":
                      failures.append(
                          f"{required[published]} port {published} must be bound to "
                          f"127.0.0.1, got host_ip={host_ip!r}"
                      )

          if failures:
              for message in failures:
                  print(f"ERROR: {message}")
              sys.exit(1)
          print("Port exposure check passed: all backend services on 127.0.0.1")
          PY
      - name: Build API runtime image
        run: docker build --target runtime -f apps/api/Dockerfile .
      - name: Build Studio Web runtime image
        run: docker build --target runtime -f apps/studio-web/Dockerfile .
      - name: Build Worker runtime image
        run: |
          docker build --target runtime -f apps/worker-orchestrator/Dockerfile -t first-short-worker-runtime .
          docker run --rm first-short-worker-runtime python -c "from celery_app import celery_app; assert celery_app.conf.beat_schedule['reconcile-media-uploads']['task'] == 'reconcile_media_uploads'"
      - name: Build two API releases and verify app-only rollback lifecycle
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --depth=1
          lifecycle_n="origin/main"
          lifecycle_context="$(mktemp -d)"
          git archive "$lifecycle_n" | tar -x -C "$lifecycle_context"
          docker build --target runtime -f "$lifecycle_context/apps/api/Dockerfile" -t release-lifecycle-n "$lifecycle_context"
          docker build --target runtime -f apps/api/Dockerfile -t release-lifecycle-candidate .
          lifecycle_base_head="$(docker run --rm release-lifecycle-candidate python -c 'from alembic.config import Config; from alembic.script import ScriptDirectory; print(ScriptDirectory.from_config(Config("alembic.ini")).get_current_head())')"
          [[ "$lifecycle_base_head" =~ ^[A-Za-z0-9_]+$ ]]
          cat > apps/api/migrations/versions/051_release_lifecycle_additive.py <<PY
          from collections.abc import Sequence

          from alembic import op

          revision: str = "051_release_lifecycle_additive"
          down_revision: str | None = "${lifecycle_base_head}"
          branch_labels: str | Sequence[str] | None = None
          depends_on: str | Sequence[str] | None = None

          def upgrade() -> None:
              op.execute("CREATE TABLE release_lifecycle_additive (id INTEGER PRIMARY KEY)")

          def downgrade() -> None:
              op.execute("DROP TABLE release_lifecycle_additive")
          PY
          docker build --target runtime -f apps/api/Dockerfile -t release-lifecycle-n-plus-one .
          python -m pip install --disable-pip-version-check pydantic==2.12.3
          lifecycle_n_head="$(docker run --rm release-lifecycle-n python -c 'from alembic.config import Config; from alembic.script import ScriptDirectory; print(ScriptDirectory.from_config(Config("alembic.ini")).get_current_head())')"
          lifecycle_n_plus_one_head="$(docker run --rm release-lifecycle-n-plus-one python -c 'from alembic.config import Config; from alembic.script import ScriptDirectory; print(ScriptDirectory.from_config(Config("alembic.ini")).get_current_head())')"
          [ "$lifecycle_n_head" != "$lifecycle_n_plus_one_head" ]
          [ "$lifecycle_n_plus_one_head" = 051_release_lifecycle_additive ]
          LIFECYCLE_N_HEAD="$lifecycle_n_head" LIFECYCLE_N_PLUS_ONE_HEAD="$lifecycle_n_plus_one_head" RELEASE_LIFECYCLE_EVIDENCE_DIR=/tmp/release-lifecycle-evidence scripts/release_lifecycle_acceptance.sh | tee /tmp/release-lifecycle-evidence.log
          grep -Fx 'release_n_started=true' /tmp/release-lifecycle-evidence/result.txt
          grep -Fx 'release_n_plus_one_project_media=true' /tmp/release-lifecycle-evidence/result.txt
          grep -Fx 'release_n_rollback_project_media=true' /tmp/release-lifecycle-evidence/result.txt
      - name: Upload release lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-lifecycle-evidence
          path: |
            /tmp/release-lifecycle-evidence.log
            /tmp/release-lifecycle-evidence
      - name: Runtime cutover acceptance
        run: scripts/cutover_runtime_acceptance.sh

  ci-required:
    if: ${{ always() }}
    needs:
      - impact
      - docs
      - hygiene
      - restore-drill
      - lint
      - test
      - first-short-runtime
      - worker-topology-runtime
      - docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require classifier and every selected validation job
        run: >-
          python3 scripts/ci_required.py
          "${{ github.event_name }}"
          "${{ needs.impact.result }}"
          "docs=${{ needs.impact.outputs.docs }}=${{ needs.docs.result }}"
          "hygiene=true=${{ needs.hygiene.result }}"
          "restore-drill=${{ needs.impact.outputs.restore }}=${{ needs.restore-drill.result }}"
          "lint=${{ needs.impact.outputs.code }}=${{ needs.lint.result }}"
          "test=${{ needs.impact.outputs.code }}=${{ needs.test.result }}"
          "first-short-runtime=${{ needs.impact.outputs.first_short }}=${{ needs.first-short-runtime.result }}"
          "worker-topology-runtime=${{ needs.impact.outputs.worker }}=${{ needs.worker-topology-runtime.result }}"
          "docker=${{ needs.impact.outputs.docker }}=${{ needs.docker.result }}"
